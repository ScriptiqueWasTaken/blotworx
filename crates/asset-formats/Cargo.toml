[package]
name = "epic-mickey-lib-rs"
version = "0.2.0"
edition = "2021"
description = "Read/write library for Epic Mickey game file formats (Gamebryo engine)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bloticle/epic-mickey-lib-rs"
homepage = "https://github.com/bloticle/epic-mickey-lib-rs"
keywords = ["epic-mickey", "gamebryo", "game-modding", "binary-format"]
categories = ["game-development", "parser-implementations", "encoding"]
readme = "README.md"

[dependencies]
serde_json = "1.0.116"
flate2 = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
cc = "1.4.5"
